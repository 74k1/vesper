[package]
name = "vesper"
version = "0.4.0"
edition = "2021"
description = "Simple freedesktop .desktop entry runner"
repository = "https://git.yukume.com/74k1/vesper"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json = "1"
eyre = "0.6"

[profile.release]
lto = true
strip = true
